name: lifedrop_public
description: A Flutter project for blood donation

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Auth & Firestore only)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.10


  # UI
  cupertino_icons: ^1.0.8

  # Image Picker & File Handling
  image_picker: ^1.2.2
  image_picker_platform_interface: ^2.11.1
  path_provider: ^2.1.5

  url_launcher: ^6.2.5
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^20.1.0

  flutter_map: ^6.1.0  # Handles map rendering and layers
  latlong2: ^0.9.1     # Handles geographic coordinates (Latitude/Longitude)

  google_maps_flutter_android: ^2.5.0
  google_maps_flutter: ^2.5.0

  rxdart: ^0.27.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome_bg.png
    - assets/images/google_logo.png
    - assets/images/donateBlood.png
    - assets/images/LOGO_PIC.png
    - assets/images/lifedrop_logo.png
flutter_launcher_icons:
  andriod: true
  ios: false
  image_path: "assets/images/lifedrop_logo.png"
  min_sdk_android: 21